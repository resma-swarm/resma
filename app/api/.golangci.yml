# RESMA — golangci-lint config (v2 format)
version: "2"

run:
  timeout: 5m
  go: "1.26"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - gocritic

settings:
  goimports:
    local-prefixes:
      - github.com/resma/api
  gocritic:
    enabled-tags:
      - performance
      - style
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gocritic
        - revive
  max-issues-per-linter: 0
  max-same-issues: 0
