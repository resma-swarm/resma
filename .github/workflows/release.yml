# RESMA — Release Pipeline
# Trigger: push de tag v*.*.*
# Jobs: build multi-arch, push Docker Hub (principal) + GHCR (mirror), GitHub Release
#
# Pré-requisitos:
#   - Secret DOCKERHUB_USERNAME = resmaswarm
#   - Secret DOCKERHUB_TOKEN    = access token do Docker Hub (criar em hub.docker.com → Account Settings → Security)
name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  DOCKERHUB_NAMESPACE: resmaswarm
  GHCR_NAMESPACE: ${{ github.repository_owner }}

jobs:
  release:
    name: Build & Push Multi-arch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR (mirror)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build & Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/api/Dockerfile
          target: runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/resma-api:latest
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/resma-api:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ env.GHCR_NAMESPACE }}/resma-api:latest
            ghcr.io/${{ env.GHCR_NAMESPACE }}/resma-api:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push ML image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/ml/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/resma-ml:latest
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/resma-ml:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ env.GHCR_NAMESPACE }}/resma-ml:latest
            ghcr.io/${{ env.GHCR_NAMESPACE }}/resma-ml:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/agent/Dockerfile
          target: runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/resma-agent:latest
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/resma-agent:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ env.GHCR_NAMESPACE }}/resma-agent:latest
            ghcr.io/${{ env.GHCR_NAMESPACE }}/resma-agent:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Installer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/installer/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/resma-install:latest
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/resma-install:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ env.GHCR_NAMESPACE }}/resma-install:latest
            ghcr.io/${{ env.GHCR_NAMESPACE }}/resma-install:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
