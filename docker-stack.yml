# RESMA — Docker Swarm Stack
#
# Deploy manual: docker stack deploy -c docker-stack.yml resma
# Install (recomendado): docker run -it --rm -v /var/run/docker.sock:/var/run/docker.sock resmaswarm/resma-install:latest
#
# Pré-requisitos:
#   - Docker Swarm initialized (docker swarm init)
#   - JWT + agent token secrets (o installer container cria automaticamente)
#   - Imagens publicadas no Docker Hub (docker.io/resmaswarm/resma-api, resma-ml, resma-agent)
#
# Variáveis (definir via env ou docker secret):
#   RESMA_CORS_ORIGINS — CSV de origens CORS (default: http://localhost:8080)
#   RESMA_DOMAIN — domínio público para Traefik + TLS (opcional)
#   RESMA_TLS_MODE — auto | internal | none (default: auto — ACME se domínio público, internal se .local)
#   RESMA_WEB_DIR — diretório do frontend (default: /app/web; vazio desabilita a UI)
#
# Proxy (Traefik) é injetado via override file quando --domain é passado ao installer.
# Ver app/installer/install.sh e docs/deploy-proxy.md.

services:
  api:
    image: docker.io/resmaswarm/resma-api:latest
    ports:
      - target: 8080
        published: 8080
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - resma-data:/data
    environment:
      RESMA_ENV: production
      RESMA_DB_PATH: /data/resma.duckdb
      RESMA_HTTP_ADDR: :8080
      RESMA_ML_URL: http://ml:8081
      RESMA_ML_ENABLED: "true"
      RESMA_JWT_SECRET_FILE: /run/secrets/resma_jwt_secret
      RESMA_CORS_ORIGINS: ${RESMA_CORS_ORIGINS:-http://localhost:8080}
      RESMA_EXCLUDED_IMAGES: docker.io/resmaswarm/resma-api:latest,docker.io/resmaswarm/resma-ml:latest,docker.io/resmaswarm/resma-agent:latest
      RESMA_COLLECT_INTERVAL: ${RESMA_COLLECT_INTERVAL:-15}
      RESMA_RETENTION_DAYS: ${RESMA_RETENTION_DAYS:-30}
      RESMA_CLUSTER_INTERVAL: ${RESMA_CLUSTER_INTERVAL:-30}
      RESMA_STORAGE_INTERVAL: ${RESMA_STORAGE_INTERVAL:-60}
      RESMA_SCHEDULER_POLL: ${RESMA_SCHEDULER_POLL:-15}
      RESMA_SSE_KEEPALIVE: ${RESMA_SSE_KEEPALIVE:-15}
      RESMA_ANALYSIS_WINDOW_DAYS: ${RESMA_ANALYSIS_WINDOW_DAYS:-7}
      RESMA_STALE_SERVICE_DAYS: ${RESMA_STALE_SERVICE_DAYS:-7}
      RESMA_ROLLBACK_POLL_INTERVAL: ${RESMA_ROLLBACK_POLL_INTERVAL:-30}
      RESMA_BCRYPT_COST: "12"
      RESMA_LOGIN_RATE_LIMIT: "5"
      RESMA_API_KEY_DEFAULT_SCOPES: read
      RESMA_API_KEY_RATE_LIMIT: "100"
      RESMA_AGENT_TOKEN_FILE: /run/secrets/resma_agent_token
      RESMA_AGENT_TASK_POLL_INTERVAL: ${RESMA_AGENT_TASK_POLL_INTERVAL:-15}
      # Frontend: vazio desabilita a UI (modo headless para CLI-only).
      RESMA_WEB_DIR: ${RESMA_WEB_DIR:-/app/web}
    secrets:
      - resma_jwt_secret
      - resma_agent_token
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
      restart_policy:
        condition: on-failure
        max_attempts: 3
      # Labels Traefik são injetadas via override file quando --domain é passado.
      # Ver app/installer/install.sh (gera /tmp/resma-proxy-override.yml).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - resma-net

  ml:
    image: docker.io/resmaswarm/resma-ml:latest
    # NÃO monta resma-data — o ML sidecar não acessa o DuckDB diretamente.
    # Ele solicita dados via HTTP ao Go API (/api/internal/*).
    environment:
      RESMA_API_URL: http://api:8080
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 128M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - resma-net

  # RESMA Agent — global service (1 replica por node, manager + workers).
  # Coleta stats locais de containers e faz push para o api.
  # Monta docker.sock para listar containers e ler stats locais.
  agent:
    image: docker.io/resmaswarm/resma-agent:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - agent-data:/data
    environment:
      RESMA_API_URL: http://api:8080
      RESMA_AGENT_TOKEN_FILE: /run/secrets/resma_agent_token
      RESMA_COLLECT_INTERVAL: ${RESMA_COLLECT_INTERVAL:-15}
      RESMA_HEARTBEAT_INTERVAL: "60"
      RESMA_OOM_EVENTS_FILE: /data/events.pending.jsonl
    secrets:
      - resma_agent_token
    deploy:
      mode: global
      resources:
        limits:
          cpus: "0.10"
          memory: 32M
        reservations:
          cpus: "0.02"
          memory: 16M
      restart_policy:
        condition: on-failure
        max_attempts: 5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - resma-net

volumes:
  resma-data:
  agent-data:

secrets:
  resma_jwt_secret:
    external: true
  resma_agent_token:
    external: true

networks:
  resma-net:
    driver: overlay
